name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run tests
        run: swift test
      - name: Build release executable
        run: swift build -c release
